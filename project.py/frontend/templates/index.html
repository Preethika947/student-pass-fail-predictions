<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction System</title>
    <meta name="description" content="Predict whether a student will Pass or Fail based on attendance, study hours, and previous marks.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Shared stylesheet from frontend/static/css/ -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="header">
        <h1>🎓 Student Performance Prediction</h1>
        <p>Enter student details below to predict whether the student is likely to
           <span class="pass-text">Pass</span> or <span class="fail-text">Fail</span>.</p>
    </div>

    <div class="container">
        <div class="card">
            <div class="divider">
                <svg viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                Enter Student Details
            </div>

            <form id="predictForm" action="/predict" method="POST">

                <!-- Attendance -->
                <div class="form-group">
                    <div class="icon-box icon-attendance">
                        <svg viewBox="0 0 24 24">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <div class="input-content">
                        <label for="attendance">Attendance Percentage (%)</label>
                        <input id="attendance" type="number" name="attendance"
                               class="form-control" placeholder="e.g. 85"
                               min="0" max="100" step="1" required>
                        <span class="help-text">Enter attendance percentage (0 – 100)</span>
                    </div>
                </div>

                <!-- Study Hours -->
                <div class="form-group">
                    <div class="icon-box icon-study">
                        <svg viewBox="0 0 24 24">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                        </svg>
                    </div>
                    <div class="input-content">
                        <label for="study_hours">Study Hours per Day</label>
                        <input id="study_hours" type="number" name="study_hours"
                               class="form-control" placeholder="e.g. 3"
                               min="0" max="24" step="0.1" required>
                        <span class="help-text">Enter average study hours per day</span>
                    </div>
                </div>

                <!-- Previous Marks -->
                <div class="form-group">
                    <div class="icon-box icon-marks">
                        <svg viewBox="0 0 24 24">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6"  y1="20" x2="6"  y2="14"></line>
                        </svg>
                    </div>
                    <div class="input-content">
                        <label for="previous_marks">Previous Exam Marks (%)</label>
                        <input id="previous_marks" type="number" name="previous_marks"
                               class="form-control" placeholder="e.g. 70"
                               min="0" max="100" step="1" required>
                        <span class="help-text">Enter previous exam marks (0 – 100)</span>
                    </div>
                </div>

                <button id="submitBtn" type="submit" class="btn-submit">
                    <svg viewBox="0 0 24 24">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    Predict Result
                </button>

            </form>
        </div>
    </div>

    <!-- Shared JS from frontend/static/js/ -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
