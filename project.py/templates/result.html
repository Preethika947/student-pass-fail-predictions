<!DOCTYPE html>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        <!-- Back to Home Button -->
        .pass-text { color: var(--pass-color); font-weight: 600; }
        .fail-text { color: var(--fail-color); font-weight: 600; }
            Back to Home
        /* Container */
        .container { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 1.5rem; }

        /* Result Banner */
        .result-banner {
            border-radius: 16px;
            padding: 2rem 2rem 1.75rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            box-shadow: var(--shadow);
            animation: popIn 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        .result-banner.pass { background: var(--pass-bg); border: 2px solid var(--pass-border); }
        .result-banner.fail { background: var(--fail-bg); border: 2px solid var(--fail-border); }

        .result-icon-wrap {
            width: 80px; height: 80px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .pass .result-icon-wrap { background: #d1fae5; color: #059669; }
        .fail .result-icon-wrap { background: #fee2e2; color: #dc2626; }
        .result-icon-wrap svg {
            width: 44px; height: 44px;
            fill: none; stroke: currentColor;
            stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
        }

        .result-body { flex: 1; }
        .result-label {
            font-size: 0.8rem; font-weight: 600;
            letter-spacing: 0.08em; text-transform: uppercase;
            margin-bottom: 0.3rem;
        }
        .pass .result-label { color: #065f46; }
        .fail .result-label { color: #991b1b; }

        .result-status { font-size: 2.4rem; font-weight: 800; line-height: 1; margin-bottom: 0.5rem; }
        .pass .result-status { color: var(--pass-color); }
        .fail .result-status { color: var(--fail-color); }

        .result-desc { font-size: 0.95rem; }
        .pass .result-desc { color: #064e3b; }
        .fail .result-desc { color: #7f1d1d; }

        /* Confidence Bar */
        .confidence-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: fadeUp 0.5s 0.15s ease both;
        }
        .confidence-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 0.75rem;
        }
        .confidence-header span:first-child { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
        .confidence-pct { font-size: 1.3rem; font-weight: 700; }
        .pass-pct { color: var(--pass-color); }
        .fail-pct { color: var(--fail-color); }

        .bar-track { height: 10px; background: #f3f4f6; border-radius: 999px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 999px; transition: width 1.1s cubic-bezier(0.4,0,0.2,1); }
        .pass-bar { background: linear-gradient(90deg, #34d399, #10b981); }
        .fail-bar { background: linear-gradient(90deg, #f87171, #ef4444); }

        /* Input Summary */
        .summary-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: fadeUp 0.5s 0.25s ease both;
        }
        .summary-title {
            font-size: 0.8rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.07em;
            color: var(--text-muted); margin-bottom: 1rem;
        }
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .summary-item {
            text-align: center; padding: 0.85rem 0.5rem;
            background: #f9fafb; border-radius: 10px;
            border: 1px solid #f3f4f6;
        }
        .summary-item .s-icon { font-size: 1.5rem; margin-bottom: 0.3rem; }
        .summary-item .s-value { font-size: 1.3rem; font-weight: 700; color: #111827; }
        .summary-item .s-label { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.2rem; }

        /* Predict Again Button */
        .btn-back {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 1rem;
            background: var(--primary); color: white;
            border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 600;
            cursor: pointer; text-decoration: none;
            transition: background 0.2s, transform 0.15s;
            box-shadow: 0 4px 14px -2px rgba(59,130,246,0.35);
            animation: fadeUp 0.5s 0.35s ease both;
        }
        .btn-back:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-back svg {
            width: 18px; height: 18px;
            fill: none; stroke: currentColor;
            stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
        }

        /* Animations */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.88); }
            to   { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎓 Student Performance Prediction</h1>
        <p>Predict whether a student will <span class="pass-text">Pass</span> or <span class="fail-text">Fail</span>.</p>
    </div>

    <div class="container">

        <!-- Result Banner -->
        <div class="result-banner {{ 'pass' if result == 'PASS' else 'fail' }}">
            <div class="result-icon-wrap">
                {% if result == 'PASS' %}
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                {% else %}
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                {% endif %}
            </div>
            <div class="result-body">
                <div class="result-label">Prediction Result</div>
                <div class="result-status">
                    {% if result == 'PASS' %}✅ PASS{% else %}❌ FAIL{% endif %}
                </div>
            </div>
        </div>

        <!-- Back to Home Button -->
        <a href="/" class="btn-back">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Back to Home
        </a>

    </div>

</body>
</html>
